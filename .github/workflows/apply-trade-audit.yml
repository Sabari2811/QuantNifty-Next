name: Apply Trade Audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'feat: add auditable trade decision records')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply trade audit
        run: bash .github/scripts/apply_trade_audit.sh
