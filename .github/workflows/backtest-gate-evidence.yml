name: QuantNifty Backtest Gate Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest-gate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser evidence dependency
        run: pip install playwright
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Verify deployed backtest gate UI
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          url = 'https://quantnifty-api.onrender.com/backtest'
          visible_required = [
              'Backtest & Validation',
              'READ ONLY',
              'Adaptive Brain',
          ]
          source_required = [
              'Risk Gate · all decisions',
              'Execution Gate · entry loop',
              'Adaptive Brain',
              'execution_gate',
              'risk_gate',
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              last = ''
              for attempt in range(1, 13):
                  try:
                      page.goto(url, wait_until='networkidle', timeout=60000)
                      last = page.content()
                      body = page.locator('body').inner_text()
                      missing_visible = [label for label in visible_required if label not in body]
                      missing_source = [label for label in source_required if label not in last]
                      if not missing_visible and not missing_source:
                          print('BACKTEST_GATE_UI_EVIDENCE=PASS')
                          print('visible_static_evidence=Backtest & Validation, READ ONLY, Adaptive Brain')
                          print('deployed_source_evidence=Risk Gate · all decisions, Execution Gate · entry loop, Adaptive Brain, execution_gate, risk_gate')
                          browser.close()
                          raise SystemExit(0)
                      print(f'attempt {attempt}/12: missing_visible={missing_visible}, missing_source={missing_source}')
                  except SystemExit:
                      raise
                  except Exception as exc:
                      print(f'attempt {attempt}/12: {exc}')
                  time.sleep(10)
              browser.close()
              raise SystemExit('deployed backtest UI evidence did not reconcile; last HTML excerpt: ' + last[:1500])
          PY
