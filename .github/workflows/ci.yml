name: QuantNifty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ./apps/api pytest
      - name: Compile
        run: python -m compileall -q apps/api/src
      - name: Tests
        run: pytest -q apps/api/tests
      - name: Validate Intelligence UI telemetry integrity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/api/src/quantnifty/web/intelligence.html').read_text(encoding='utf-8')
          required=['Current Brain Plan · Read Only','Active Paper Trade · Live &amp;P&amp;L','normalizeTradeTelemetry','Risk anchor: ','Premium movement is recomputed from entry → current mark']
          # The title is stored as HTML text, so accept the exact rendered title separately.
          required=['Current Brain Plan · Read Only','Active Paper Trade · Live P&amp;L','normalizeTradeTelemetry','Risk anchor: ','Premium movement is recomputed from entry → current mark']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing UI markers: '+repr(missing))
          if "trade.movement||'FLAT'" in s: raise SystemExit('stale backend movement rendering remains')
          if "trade.favorable_move_pct||0" in s: raise SystemExit('stale favorable movement rendering remains')
          print('UI telemetry integrity validation passed')
          PY
