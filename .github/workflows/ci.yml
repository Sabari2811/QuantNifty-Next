name: QuantNifty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ./apps/api pytest
      - name: Compile
        run: python -m compileall -q apps/api/src
      - name: Tests
        run: pytest -q apps/api/tests
