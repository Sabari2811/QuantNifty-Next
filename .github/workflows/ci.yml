name: QuantNifty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ./apps/api pytest
      - name: Compile
        run: python -m compileall -q apps/api/src
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          pytest -q apps/api/tests > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Publish pytest diagnostics
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('pytest-output.txt') ? fs.readFileSync('pytest-output.txt', 'utf8') : 'pytest output file was not created';
            const conclusion = process.env.TEST_EXIT_CODE === '0' ? 'success' : 'failure';
            const body = text.length > 6000 ? text.slice(-6000) : text;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'pytest-diagnostics',
              head_sha: context.sha,
              status: 'completed',
              conclusion,
              output: {title: `pytest exit ${process.env.TEST_EXIT_CODE || 'unknown'}`, summary: 'Full pytest output is captured below.', text: body}
            });
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantnifty-pytest-output
          path: pytest-output.txt
          if-no-files-found: warn
      - name: Validate Intelligence UI telemetry integrity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/api/src/quantnifty/web/intelligence.html').read_text(encoding='utf-8')
          required=['Current Brain Plan · Read Only','Active Paper Trade · Live P&amp;L','normalizeTradeTelemetry','Risk view · entry anchored','Premium Target / SL']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing UI markers: '+repr(missing))
          if "trade.movement||'FLAT'" in s: raise SystemExit('stale backend movement rendering remains')
          if "trade.favorable_move_pct||0" in s: raise SystemExit('stale favorable movement rendering remains')
          print('UI telemetry integrity validation passed')
          PY
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
