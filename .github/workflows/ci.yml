name: QuantNifty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ./apps/api pytest
      - name: Compile
        run: python -m compileall -q apps/api/src
      - name: Tests
        run: pytest -q apps/api/tests
      - name: Harden Intelligence UI telemetry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/quantnifty/web/intelligence.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          replacements=[
            ("function tradeBadgeClass(side){const s=String(side||'').toUpperCase();return s==='PE'?'tradeBadgePE':s==='CE'?'tradeBadgeCE':''}\nfunction renderTradeSignal(signal)",
             "function tradeBadgeClass(side){const s=String(side||'').toUpperCase();return s==='PE'?'tradeBadgePE':s==='CE'?'tradeBadgeCE':''}\nfunction normalizeTradeTelemetry(trade){const entry=Number(trade&&trade.entry_price),current=Number(trade&&trade.current_price);const valid=Number.isFinite(entry)&&entry>0&&Number.isFinite(current);const delta=valid?current-entry:0;const pct=valid?(delta/entry)*100:0;const movement=pct>0.0001?'UP':pct<-0.0001?'DOWN':'FLAT';const positive=pct>0.0001,negative=pct<-0.0001;const qty=Number(trade&&trade.quantity),lotSize=Number(trade&&trade.lot_size),lots=Number(trade&&trade.lots);const hasQty=Number.isFinite(qty)&&qty>0;const hasLots=Number.isFinite(lots)&&lots>=0;const qtyLabel=hasQty?'Qty '+n(qty,0):'Qty —';const lotsLabel=hasLots?'Lots '+n(lots,2):(hasQty&&Number.isFinite(lotSize)&&lotSize>0?'Lots '+n(qty/lotSize,2):'Lots —');return {...trade,movement,movement_pct:pct,positive,negative,qty_label:qtyLabel,lots_label:lotsLabel}}\nfunction renderTradeSignal(signal)"),
            ("const pnl=Number(trade.pnl||0),positive=pnl>0,negative=pnl<0,side=trade.option_side||decision.option_side||'';const cls=positive?'pnlUp':negative?'pnlDown':'';badge.className='tradebadge '+tradeBadgeClass(side);badge.textContent='TRADE #'+(trade.trade_number||'?')+' · '+(trade.movement||'FLAT');const movePct=Number(trade.favorable_move_pct||0);const width=Math.min(100,Math.max(0,Math.abs(movePct)));const fill=positive?'#4bd3a7':negative?'#ff6476':'#7786a5';",
             "const t=normalizeTradeTelemetry(trade),pnl=Number(t.pnl||0),positive=t.positive,negative=t.negative,side=t.option_side||decision.option_side||'';const cls=positive?'pnlUp':negative?'pnlDown':'';badge.className='tradebadge '+tradeBadgeClass(side);badge.textContent='TRADE #'+(t.trade_number||'?')+' · '+t.movement;const movePct=Number(t.movement_pct||0);const width=Math.min(100,Math.max(0,Math.abs(movePct)));const fill=positive?'#4bd3a7':negative?'#ff6476':'#7786a5';"),
            ("<div class=\"pnlSub\">Qty '+n(trade.quantity,0)+' · Lots '+(trade.lots==null?'—':n(trade.lots,2))+'</div>","<div class=\"pnlSub\">'+t.qty_label+' · '+t.lots_label+'</div>"),
            ("<div class=\"movementArrow '+(positive?'pnlGreen':negative?'pnlRed':'')+'\">'+(positive?'↗':negative?'↘':'→')+'</div><div style=\"min-width:80px;font-weight:900\">'+(trade.movement||'FLAT')+'</div><div class=\"movementTrack\"><div class=\"movementFill\" style=\"width:'+width+'%;background:'+fill+'\"></div></div><div class=\"pnlValue '+(positive?'pnlGreen':negative?'pnlRed':'')+'\">'+n(movePct,2)+'%</div>","<div class=\"movementArrow '+(positive?'pnlGreen':negative?'pnlRed':'')+'\">'+(positive?'↗':negative?'↘':'→')+'</div><div style=\"min-width:80px;font-weight:900\">'+t.movement+'</div><div class=\"movementTrack\"><div class=\"movementFill\" style=\"width:'+width+'%;background:'+fill+'\"></div></div><div class=\"pnlValue '+(positive?'pnlGreen':negative?'pnlRed':'')+'\">'+(movePct>0?'+':'')+n(movePct,2)+'%</div>"),
            ("<div class=\"quickPanel\"><div class=\"pnlLabel\">Quick risk view</div><div class=\"metric\"><span>SL</span><b>'+n(trade.sl_spot,2)+'</b></div><div class=\"metric\"><span>Target</span><b>'+n(trade.target_spot,2)+'</b></div><div class=\"metric\"><span>MFE / MAE</span><b>+'+n(trade.mfe_pct,2)+'% / '+n(trade.mae_pct,2)+'%</b></div></div>","<div class=\"quickPanel\"><div class=\"pnlLabel\">Quick risk view · entry anchored</div><div class=\"metric\"><span>Entry spot</span><b>'+n(trade.entry_spot,2)+'</b></div><div class=\"metric\"><span>SL</span><b>'+n(trade.sl_spot,2)+'</b></div><div class=\"metric\"><span>Target</span><b>'+n(trade.target_spot,2)+'</b></div><div class=\"metric\"><span>MFE / MAE</span><b>+'+n(trade.mfe_pct,2)+'% / '+n(trade.mae_pct,2)+'%</b></div><div class=\"pnlSub\">Risk anchor: '+(trade.risk_anchor||'ENTRY_SPOT_IMMUTABLE')+'</div></div>"),
            ("<div class=\"execTitle\"><span>Execution Plan · Read Only</span>","<div class=\"execTitle\"><span>Current Brain Plan · Read Only</span>"),
            ("<div class=\"pnlTitle\">📊 Live P&amp;L Monitor</div>","<div class=\"pnlTitle\">📊 Active Paper Trade · Live P&amp;L</div>"),
            ("Read-only paper telemetry. P&amp;L uses option premium mark hierarchy BID → LAST → ASK. Invested amount = entry premium × quantity. No broker execution.","Read-only paper telemetry. Active trade is historical entry state; current Brain plan may differ. Premium movement is recomputed from entry → current mark. Risk is anchored to entry spot. Invested amount = entry premium × quantity. No broker execution.")]
          for old,new in replacements:
            if old in s:
              s=s.replace(old,new,1); changed=True
          p.write_text(s,encoding='utf-8')
          required=['Current Brain Plan · Read Only','Active Paper Trade · Live P&amp;L','normalizeTradeTelemetry','Risk anchor: ','Premium movement is recomputed from entry → current mark']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing UI markers: '+repr(missing))
          if "trade.movement||'FLAT'" in s or "trade.favorable_move_pct||0" in s: raise SystemExit('stale movement rendering remains')
          print('UI integrity validated; changed=',changed)
          PY
      - name: Commit UI hardening when needed
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/quantnifty/web/intelligence.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/web/intelligence.html
          git commit -m "fix: harden intelligence paper trade telemetry UI"
          git push origin main
