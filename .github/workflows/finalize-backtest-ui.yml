name: Finalize Backtest UI
on:
  push:
    branches: [main]
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate route and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('apps/api/src/quantnifty')
          p=root/'main.py'; s=p.read_text()
          if 'def backtest_page()' not in s:
              s=s.replace('@app.get("/api/v1/health")','@app.get("/backtest")\ndef backtest_page():\n    path=os.path.join(os.path.dirname(__file__),"web","backtest.html")\n    return FileResponse(path)\n\n@app.get("/api/v1/health")',1); p.write_text(s)
          nav='    <a data-qn-nav="backtest" href="/backtest">Backtest &amp; Validation<small>OOS performance, risk &amp; regime validation</small></a>\n'
          marker='    <a data-qn-nav="raw" href="/">Raw Data<small>Live provider market &amp; option-chain data</small></a>\n'
          for name in ('index.html','intelligence.html'):
              p=root/'web'/name; s=p.read_text()
              if 'data-qn-nav="backtest"' not in s and marker in s:
                  p.write_text(s.replace(marker,marker+nav,1))
          PY
      - name: Validate
        run: |
          python -m pip install pytest
          python -m pip install -e ./apps/api
          python -m pytest -q
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/main.py apps/api/src/quantnifty/web/index.html apps/api/src/quantnifty/web/intelligence.html apps/api/src/quantnifty/web/backtest.html
          git rm .github/workflows/finalize-backtest-ui.yml
          git commit -m "Finalize Backtest and Validation UI"
          git push