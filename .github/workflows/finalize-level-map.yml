name: Finalize Market Level Map

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make level map deterministic and fail-closed
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/api/src/quantnifty/web/index.html')
          text = path.read_text(encoding='utf-8')
          old = re.search(r'function renderLevelMap\(d,cw,pw\)\{.*?\}\nfunction render\(d\)', text, re.S)
          if not old:
              raise SystemExit('renderLevelMap function not found')
          new = '''function renderLevelMap(d,cw,pw){const items=[['Support',d.support,'Below spot'],['Put Wall',pw?.strike,'Gamma wall'],['Spot',d.spot,'Current NIFTY',true],['Resistance',d.resistance,'Above spot'],['Gamma Flip',d.gamma_flip,'Regime level'],['Max Pain',d.max_pain,'Option pain'],['Call Wall',cw?.strike,'Gamma wall']].filter(x=>Number.isFinite(Number(x[1]))).sort((a,b)=>Number(a[1])-Number(b[1]));$('levelMapList').innerHTML=items.length?items.map(([label,val,note,primary])=>`<div class="level-item${primary?' primary':''}"><span class="name">${esc(label)}</span><span class="price">${esc(n(val,0))}</span><span class="note">${esc(note)}</span></div>`).join(''):'<div class="muted">No provider market levels</div>'}\nfunction render(d)'''
          text = text[:old.start()] + new + text[old.end():]
          needle = "fresh.textContent='No live snapshot';grid.innerHTML='';levels.innerHTML='<div class=\"level-card muted\">No provider market levels</div>';"
          replacement = needle + "$('levelMapList').innerHTML='<div class=\"muted\">No provider market levels</div>';"
          if needle not in text:
              raise SystemExit('invalid-state render block not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/quantnifty/web/index.html
          git diff --cached --quiet || git commit -m "Finalize simple market level map"
          git push
          git rm .github/workflows/finalize-level-map.yml
          git commit -m "Remove one-time level map workflow"
          git push
