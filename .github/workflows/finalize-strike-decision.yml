name: Finalize strike decision

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-strike-decision.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Implement decision and gamma-blast qualification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          selector = Path('apps/api/src/quantnifty/strike_selector.py')
          selector.write_text('''from __future__ import annotations

from typing import Any


def _num(value: Any, default: float = 0.0) -> float:
    try:
        return float(value)
    except (TypeError, ValueError):
        return default


def _is_itm(row: dict[str, Any], spot: float) -> bool:
    strike = _num(row.get("strike"))
    return (row.get("side") == "CE" and strike < spot) or (row.get("side") == "PE" and strike > spot)


def _is_otm(row: dict[str, Any], spot: float) -> bool:
    strike = _num(row.get("strike"))
    return (row.get("side") == "CE" and strike > spot) or (row.get("side") == "PE" and strike < spot)


def _score(row: dict[str, Any], spot: float, expected_move: float | None, gamma_blast: bool) -> float:
    premium = max(_num(row.get("last_price")), 0.0)
    delta = abs(_num(row.get("delta")))
    gamma = abs(_num(row.get("gamma")))
    theta = abs(_num(row.get("theta")))
    volume = max(_num(row.get("volume")), 0.0)
    bid, ask = _num(row.get("bid")), _num(row.get("ask"))
    spread = max(0.0, ask - bid) if ask > 0 and bid > 0 else premium * 0.10
    spread_pct = spread / max(premium, 1.0)
    distance = abs(_num(row.get("strike")) - spot)
    move_fit = 1.0
    if expected_move and expected_move > 0:
        move_fit = max(0.0, 1.0 - max(0.0, distance - expected_move) / expected_move)
    liquidity = min(1.0, volume / 100_000.0)
    score = 45.0 * delta + 25.0 * min(1.0, gamma * 100.0) + 20.0 * move_fit + 10.0 * liquidity
    score -= 20.0 * min(1.0, spread_pct)
    score -= 10.0 * min(1.0, theta / max(premium, 1.0))
    if gamma_blast:
        score += 25.0 * min(1.0, gamma * 100.0)
    return round(score, 4)


def select_strikes(
    spot: float,
    rows: list[dict[str, Any]],
    direction: str,
    *,
    gamma_blast: bool = False,
    expected_move: float | None = None,
    gamma_blast_qualified: bool = True,
) -> dict[str, Any]:
    direction = direction.upper()
    if spot <= 0 or direction not in {"BULLISH", "BEARISH"}:
        return {"eligible": False, "reason": "no_directional_signal", "candidates": [], "selected": None}
    if gamma_blast and not gamma_blast_qualified:
        return {
            "eligible": False,
            "reason": "gamma_blast_not_confirmed",
            "required_confirmation": [
                "directional_breakout_or_breakdown",
                "volume_confirmation",
                "OI_flow_confirmation",
                "gamma_acceleration",
                "dealer_flow_confirmation",
                "expected_move_expansion",
            ],
            "candidates": [],
            "selected": None,
        }
    side = "CE" if direction == "BULLISH" else "PE"
    side_rows = [r for r in rows if r.get("side") == side and _num(r.get("last_price")) > 0]
    if not side_rows:
        return {"eligible": False, "reason": "no_liquid_contracts", "candidates": [], "selected": None}
    atm = min(side_rows, key=lambda r: abs(_num(r.get("strike")) - spot))
    itm = sorted((r for r in side_rows if _is_itm(r, spot)), key=lambda r: abs(_num(r.get("strike")) - spot))
    candidates = [atm] + itm[:3]
    if gamma_blast:
        otm = sorted((r for r in side_rows if _is_otm(r, spot)), key=lambda r: abs(_num(r.get("strike")) - spot))
        if expected_move and expected_move > 0:
            otm = [r for r in otm if abs(_num(r.get("strike")) - spot) <= expected_move]
        candidates.extend(otm[:2])
    unique: dict[str, dict[str, Any]] = {}
    for row in candidates:
        unique[f"{row.get('side')}:{_num(row.get('strike')):.4f}"] = row
    ranked = []
    for row in unique.values():
        classification = "ATM" if row is atm else "ITM" if _is_itm(row, spot) else "OTM"
        ranked.append({
            "side": row.get("side"),
            "strike": _num(row.get("strike")),
            "classification": classification,
            "security_id": row.get("security_id", ""),
            "trading_symbol": row.get("trading_symbol", ""),
            "premium": _num(row.get("last_price")),
            "delta": _num(row.get("delta")),
            "gamma": _num(row.get("gamma")),
            "theta": _num(row.get("theta")),
            "iv": _num(row.get("iv")),
            "volume": _num(row.get("volume")),
            "score": _score(row, spot, expected_move, gamma_blast),
        })
    ranked.sort(key=lambda r: r["score"], reverse=True)
    return {
        "eligible": bool(ranked),
        "direction": direction,
        "strategy": "GAMMA_BLAST" if gamma_blast else "DIRECTIONAL",
        "allowed_classifications": ["ATM", "ITM", "OTM"] if gamma_blast else ["ATM", "ITM"],
        "selected": ranked[0] if ranked else None,
        "candidates": ranked,
        "reason": "best_risk_adjusted_strike" if ranked else "no_candidate",
    }
''', encoding='utf-8')

          main = Path('apps/api/src/quantnifty/main.py')
          text = main.read_text(encoding='utf-8')
          old = '''@app.get("/api/v1/decision")\nasync def decision(strategy: str = "directional"):\n    try:\n        data = await snapshot()\n    except Exception as exc:\n        raise HTTPException(status_code=503, detail=str(exc)) from exc\n    mode = strategy.strip().lower()\n    if mode not in {"directional", "gamma_blast"}:\n        raise HTTPException(400, "strategy must be directional or gamma_blast")\n    selection = select_strikes(data["spot"], data["option_chain"], data["bias"], gamma_blast=(mode == "gamma_blast"), expected_move=(data.get("expected_move") or {}).get("move"))\n    return {"mode": "READ_ONLY", "execution": "DISABLED", "strategy": "GAMMA_BLAST" if mode == "gamma_blast" else "DIRECTIONAL", "bias": data["bias"], "confidence": data["confidence"], "strike_selection": selection}\n'''
          new = '''@app.get("/api/v1/decision")\nasync def decision(strategy: str = "directional"):\n    try:\n        data = await snapshot()\n    except Exception as exc:\n        raise HTTPException(status_code=503, detail=str(exc)) from exc\n    mode = strategy.strip().lower()\n    if mode not in {"directional", "gamma_blast"}:\n        raise HTTPException(400, "strategy must be directional or gamma_blast")\n\n    expected_move = (data.get("expected_move") or {}).get("move")\n    confidence_ok = data["confidence"] >= 60.0\n    liquidity_ok = data["liquidity_score"] >= 50.0\n    directional_ok = data["bias"] in {"BULLISH", "BEARISH"}\n    gamma_state = data.get("gamma_flip")\n    gamma_position_ok = gamma_state is not None and ((data["bias"] == "BULLISH" and data["spot"] > gamma_state) or (data["bias"] == "BEARISH" and data["spot"] < gamma_state))\n    dealer_ok = (data["bias"] == "BULLISH" and data["dealer_flow"] == "PUT_SUPPORT") or (data["bias"] == "BEARISH" and data["dealer_flow"] == "CALL_RESISTANCE")\n    previous = cache.get("previous_snapshot") or {}\n    current_gex = data.get("gex")\n    previous_gex = previous.get("gex")\n    gamma_acceleration = previous_gex is not None and current_gex is not None and abs(current_gex) > abs(previous_gex) * 1.10\n    move_expansion = previous.get("expected_move", {}).get("move") if isinstance(previous.get("expected_move"), dict) else None\n    move_expansion = expected_move is not None and (move_expansion is None or expected_move > move_expansion * 1.05)\n    volume_ok = data.get("rows", 0) >= 20 and sum(r.get("volume", 0) for r in data.get("option_chain", [])) > 0\n    gamma_blast_qualified = all([confidence_ok, liquidity_ok, directional_ok, gamma_position_ok, dealer_ok, gamma_acceleration, move_expansion, volume_ok])\n    selection = select_strikes(data["spot"], data["option_chain"], data["bias"], gamma_blast=(mode == "gamma_blast"), expected_move=expected_move, gamma_blast_qualified=gamma_blast_qualified)\n    trade_allowed = directional_ok and confidence_ok and liquidity_ok and selection["eligible"]\n    return {\n        "mode": "READ_ONLY",\n        "execution": "DISABLED",\n        "strategy": "GAMMA_BLAST" if mode == "gamma_blast" else "DIRECTIONAL",\n        "bias": data["bias"],\n        "confidence": data["confidence"],\n        "risk_gate": {"directional_signal": directional_ok, "confidence": confidence_ok, "liquidity": liquidity_ok, "gamma_position": gamma_position_ok, "dealer_flow": dealer_ok, "gamma_acceleration": gamma_acceleration, "expected_move_expansion": move_expansion, "volume": volume_ok, "trade_allowed": trade_allowed},\n        "strike_selection": selection,\n    }\n'''
          if old not in text:
              raise SystemExit('decision endpoint pattern not found')
          text = text.replace(old, new)
          text = text.replace('cache: dict[str, Any] = {"snapshot": None, "updated_at": None}', 'cache: dict[str, Any] = {"snapshot": None, "previous_snapshot": None, "updated_at": None}')
          text = text.replace('    result = analytics(spot, rows, expiry)\n    result["expiry"] = expiry\n    cache["snapshot"], cache["updated_at"] = result, time.time()', '    result = analytics(spot, rows, expiry)\n    result["expiry"] = expiry\n    if cache.get("snapshot") is not None:\n        cache["previous_snapshot"] = cache["snapshot"]\n    cache["snapshot"], cache["updated_at"] = result, time.time()')
          main.write_text(text, encoding='utf-8')

          checklist = Path('docs/MASTER_CHECKLIST.md')
          c = checklist.read_text(encoding='utf-8')
          c = c.replace('- [x] Direction score / rationale', '- [x] Direction score / rationale\n- [x] Dynamic ATM + ITM strike selection for directional trades\n- [x] Controlled OTM strike selection restricted to qualified Gamma Blast mode\n- [x] Gamma Blast qualification gates: direction, volume, OI/dealer context, gamma acceleration, expected-move expansion')
          c = c.replace('- [x] No UI execution controls', '- [x] No UI execution controls\n- [x] Read-only Decision/Risk gate surfaced without order execution')
          checklist.write_text(c, encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > apps/api/tests/test_decision_and_ui_contract.py <<'PY'
          from pathlib import Path
          from quantnifty.strike_selector import select_strikes

          def row(strike, side, premium=100, delta=0.5, gamma=0.01, theta=-2, volume=200000):
              return {'strike': strike, 'side': side, 'last_price': premium, 'delta': delta, 'gamma': gamma, 'theta': theta, 'iv': 10, 'volume': volume, 'bid': premium-1, 'ask': premium+1, 'security_id': str(strike)+side}

          def test_gamma_blast_requires_confirmation():
              rows = [row(23800, 'CE', 300, .75), row(24000, 'CE', 150, .52), row(24100, 'CE', 80, .35)]
              result = select_strikes(24000, rows, 'BULLISH', gamma_blast=True, expected_move=220, gamma_blast_qualified=False)
              assert not result['eligible']
              assert result['reason'] == 'gamma_blast_not_confirmed'

          def test_gamma_blast_allows_controlled_otm_when_confirmed():
              rows = [row(23800,'CE',300,.75), row(24000,'CE',150,.52), row(24100,'CE',80,.35), row(24200,'CE',45,.22), row(24500,'CE',10,.08)]
              result = select_strikes(24000, rows, 'BULLISH', gamma_blast=True, expected_move=220, gamma_blast_qualified=True)
              assert result['allowed_classifications'] == ['ATM', 'ITM', 'OTM']
              assert {x['classification'] for x in result['candidates']} == {'ATM', 'ITM', 'OTM'}
              assert all(x['strike'] <= 24200 for x in result['candidates'] if x['classification'] == 'OTM')

          def test_directional_never_allows_otm():
              rows = [row(23800,'CE',300,.75), row(24000,'CE',150,.52), row(24200,'CE',70,.28)]
              result = select_strikes(24000, rows, 'BULLISH')
              assert {x['classification'] for x in result['candidates']} <= {'ATM', 'ITM'}

          def test_ui_contains_strike_selection_contract():
              html = Path('apps/api/src/quantnifty/web/index.html').read_text(encoding='utf-8')
              assert 'strike_selection' in html
              assert 'ATM' in html and 'ITM' in html and 'OTM' in html
              assert 'execution' in html or 'READ_ONLY' in html
          PY
          python -m compileall -q apps/api/src
          pytest -q apps/api/tests

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/quantnifty/strike_selector.py apps/api/src/quantnifty/main.py apps/api/tests/test_decision_and_ui_contract.py docs/MASTER_CHECKLIST.md
          git diff --cached --quiet || git commit -m 'Complete strike selection and read-only decision gates'
          git push

      - name: Wait for production and validate dashboard contract
        shell: bash
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS https://quantnifty-api.onrender.com/health >/tmp/health.json; then
              if grep -q '"status":"ok"' /tmp/health.json || grep -q '"status": "ok"' /tmp/health.json; then
                echo 'Production health is OK'
                break
              fi
            fi
            sleep 10
          done
          curl -fsS https://quantnifty-api.onrender.com/ >/tmp/dashboard.html
          grep -q 'Market Intelligence Data' /tmp/dashboard.html
          grep -q 'strike_selection' /tmp/dashboard.html
          echo 'Production dashboard contract validated'

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/finalize-strike-decision.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove one-time strike decision workflow'
          git push
