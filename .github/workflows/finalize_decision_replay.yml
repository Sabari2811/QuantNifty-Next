name: Finalize decision and replay contracts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contracts and validate
        run: |
          python -m pip install -e apps/api pytest
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/quantnifty/main.py')
          s=p.read_text()
          s=s.replace('from quantnifty.strike_selector import select_strikes\n','from quantnifty.strike_selector import select_strikes\nfrom quantnifty.institutional_engine import final_decision, replay_signal_stack\n')
          s=s.replace('version="1.7.0"','version="1.8.0"')
          s=s.replace('"NO_TRADE_INTELLIGENCE"],"replay":"AVAILABLE"','"NO_TRADE_INTELLIGENCE","INSTITUTIONAL_SIGNAL","RISK_ENGINE","FINAL_DECISION","EXECUTION_PLAN"],"replay":"AVAILABLE"')
          anchor='@app.get("/api/v1/historical")'
          routes='''@app.get("/api/v1/final-decision")\nasync def final_decision_api(strategy: str="directional"):\n    mode=strategy.strip().lower()\n    if mode not in {"directional","gamma_blast"}: raise HTTPException(400,"strategy must be directional or gamma_blast")\n    try: data=await snapshot()\n    except Exception as exc: raise HTTPException(status_code=503,detail=str(exc)) from exc\n    result=final_decision(data,data.get("previous_snapshot"),mode)\n    return {"mode":"READ_ONLY","strategy":mode,"timestamp":data["timestamp"],"spot":data["spot"],"decision":result}\n\n@app.post("/api/v1/replay/decisions")\nasync def replay_decisions_api(payload: dict[str,Any]):\n    snapshots=payload.get("snapshots")\n    if not isinstance(snapshots,list) or not snapshots: raise HTTPException(400,"snapshots must be a non-empty list")\n    clean=[x for x in snapshots if isinstance(x,dict)]\n    if len(clean)!=len(snapshots): raise HTTPException(400,"every snapshot must be an object")\n    return {"mode":"READ_ONLY_REPLAY","decision_stack":replay_signal_stack(clean)}\n\n'''
          if '@app.get("/api/v1/final-decision")' not in s: s=s.replace(anchor,routes+anchor)
          old='''@app.post("/api/v1/replay")\nasync def replay_api(payload: dict[str,Any]):\n    points=replay(normalize_candles(payload,payload.get("scrip_code"))); return {"mode":"READ_ONLY_REPLAY","summary":summary(points),"points":to_dict(points)}\n'''
          new='''@app.post("/api/v1/replay")\nasync def replay_api(payload: dict[str,Any]):\n    if isinstance(payload.get("snapshots"),list):\n        snapshots=payload.get("snapshots")\n        if not snapshots: raise HTTPException(400,"snapshots must be a non-empty list")\n        return {"mode":"READ_ONLY_REPLAY","decision_stack":replay_signal_stack([x for x in snapshots if isinstance(x,dict)])}\n    points=replay(normalize_candles(payload,payload.get("scrip_code"))); return {"mode":"READ_ONLY_REPLAY","summary":summary(points),"points":to_dict(points)}\n'''
          if old not in s: raise SystemExit('replay endpoint contract not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python -m compileall -q apps/api/src/quantnifty
          pytest -q
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/main.py
          git rm .github/workflows/finalize_decision_replay.yml
          git commit -m "Finalize canonical decision and replay contracts"
          git push
