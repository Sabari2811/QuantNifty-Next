name: Fix final decision context
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and validate
        run: |
          python -m pip install -e apps/api pytest
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/quantnifty/main.py')
          s=p.read_text()
          old='result=final_decision(data,data.get("previous_snapshot"),mode)'
          new='result=final_decision(data,cache.get("previous_snapshot"),mode)'
          if old not in s: raise SystemExit('final decision context line not found')
          p.write_text(s.replace(old,new))
          PY
          python -m compileall -q apps/api/src/quantnifty
          pytest -q
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/main.py
          git rm .github/workflows/fix_final_decision_context.yml
          git commit -m "Use canonical previous snapshot for final decision"
          git push
