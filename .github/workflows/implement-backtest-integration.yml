name: Implement backtest integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate API and status
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/api/src/quantnifty/main.py')
          s = p.read_text()
          if 'from quantnifty.backtest import BacktestConfig, run_backtest, validation_report' not in s:
              s = s.replace('from quantnifty.institutional_engine import final_decision, replay_signal_stack', 'from quantnifty.institutional_engine import final_decision, replay_signal_stack\nfrom quantnifty.backtest import BacktestConfig, run_backtest, validation_report')
          if '"BACKTEST_ENGINE"' not in s:
              s = s.replace('"EXECUTION_PLAN"],"replay":"AVAILABLE"}', '"EXECUTION_PLAN","BACKTEST_ENGINE","OOS_VALIDATION","COST_MODEL","REGIME_VALIDATION"],"replay":"AVAILABLE","backtest":"AVAILABLE"}')
          marker='@app.get("/api/v1/trading/status")'
          endpoint='''@app.post("/api/v1/backtest")\nasync def backtest_api(payload: dict[str, Any]):\n    snapshots = payload.get("snapshots")\n    if not isinstance(snapshots, list) or len(snapshots) < 2:\n        raise HTTPException(400, "snapshots must contain at least 2 snapshot objects")\n    if any(not isinstance(x, dict) for x in snapshots):\n        raise HTTPException(400, "every snapshot must be an object")\n    mode = str(payload.get("strategy") or "directional").strip().lower()\n    if mode not in {"directional", "gamma_blast"}:\n        raise HTTPException(400, "strategy must be directional or gamma_blast")\n    raw = payload.get("config") or {}\n    try:\n        cfg = BacktestConfig(**{k: raw[k] for k in raw if k in BacktestConfig.__dataclass_fields__})\n        return run_backtest(snapshots, mode, cfg)\n    except (TypeError, ValueError) as exc:\n        raise HTTPException(400, f"invalid backtest configuration: {exc}") from exc\n\n\n@app.post("/api/v1/validation")\nasync def validation_api(payload: dict[str, Any]):\n    snapshots = payload.get("snapshots")\n    if not isinstance(snapshots, list) or len(snapshots) < 2:\n        raise HTTPException(400, "snapshots must contain at least 2 snapshot objects")\n    mode = str(payload.get("strategy") or "directional").strip().lower()\n    if mode not in {"directional", "gamma_blast"}:\n        raise HTTPException(400, "strategy must be directional or gamma_blast")\n    raw = payload.get("config") or {}\n    try:\n        cfg = BacktestConfig(**{k: raw[k] for k in raw if k in BacktestConfig.__dataclass_fields__})\n        return validation_report(snapshots, mode, cfg)\n    except (TypeError, ValueError) as exc:\n        raise HTTPException(400, f"invalid validation configuration: {exc}") from exc\n\n\n'''
          if '/api/v1/backtest' not in s:
              s = s.replace(marker, endpoint + marker)
          p.write_text(s)
      - name: Self remove integration workflow
        run: |
          rm -f .github/workflows/implement-backtest-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/quantnifty/main.py .github/workflows/implement-backtest-integration.yml
          git commit -m "Integrate historical backtesting and validation API" || exit 0
          git push
