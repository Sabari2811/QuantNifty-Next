name: Implement Backtest Validation UI
on:
  workflow_dispatch:
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build UI and route integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/api/src/quantnifty')
          main = root / 'main.py'
          text = main.read_text()
          route = '''\n@app.get("/backtest")\ndef backtest_page():\n    path=os.path.join(os.path.dirname(__file__),"web","backtest.html")\n    return FileResponse(path)\n'''
          if 'def backtest_page()' not in text:
              anchor='@app.get("/api/v1/health")'
              text=text.replace(anchor, route+'\n'+anchor, 1)
          main.write_text(text)

          nav_link='''    <a data-qn-nav="backtest" href="/backtest">Backtest &amp; Validation<small>OOS performance, risk &amp; regime validation</small></a>\n'''
          for name in ('index.html','intelligence.html'):
              p=root/'web'/name
              s=p.read_text()
              if 'data-qn-nav="backtest"' not in s:
                  marker='    <a data-qn-nav="raw" href="/">Raw Data<small>Live provider market &amp; option-chain data</small></a>\n'
                  if marker in s:
                      s=s.replace(marker, marker+nav_link, 1)
                  else:
                      marker2='    <a data-qn-nav="raw" href="/">Raw Data'
                      pos=s.find(marker2)
                      if pos>=0:
                          end=s.find('</a>',pos)+4
                          s=s[:end]+'\n'+nav_link+s[end:]
                  p.write_text(s)

          page = root/'web'/'backtest.html'
          page.write_text(r'''<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantNifty Backtest &amp; Validation</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080d19;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#17233d,#080d19 65%)}main{max-width:1600px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}h1{margin:0;font-size:30px}.sub{color:#8e9ab5}.pill{border:1px solid #33405e;border-radius:999px;padding:7px 12px;font-size:12px}.panel{background:#11182b;border:1px solid #263250;border-radius:14px;padding:17px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #202b46}.metric:last-child{border:0}.metric span{color:#8e9ab5}.big{font-size:27px;font-weight:900;margin:5px 0}.muted{color:#7d89a4}.good{border-color:#356b50}.warn{border-color:#765a34}.bad{border-color:#7b3c46}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;color:#8e9ab5;font-size:11px}.field input,.field select{background:#0d1425;color:#e8edf7;border:1px solid #33405e;border-radius:8px;padding:9px}.button{border:1px solid #52698f;background:#18243d;color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700}.tablewrap{overflow:auto;max-height:430px;border:1px solid #263250;border-radius:10px}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:720px}.table th{position:sticky;top:0;background:#162038;color:#8e9ab5;text-align:right;padding:9px}.table th:first-child,.table td:first-child{text-align:left}.table td{padding:8px;border-bottom:1px solid #202b46;text-align:right}.note{font-size:11px;line-height:1.5;color:#8e9ab5}.qn-drawer-toggle{position:fixed;left:0;top:42%;z-index:1001;width:34px;height:76px;border:1px solid #33405e;border-left:0;border-radius:0 12px 12px 0;background:#111a2d;color:#e8edf7;cursor:pointer;font-size:16px}.qn-drawer{position:fixed;left:0;top:0;bottom:0;z-index:1000;width:250px;padding:22px 14px;background:rgba(10,15,28,.98);border-right:1px solid #263250;box-shadow:16px 0 40px #0007;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;gap:12px}.qn-drawer.open{transform:translateX(0)}.qn-drawer-title{font-size:14px;font-weight:800;padding:4px 10px 8px}.qn-drawer-sub{font-size:10px;color:#69758f;padding:0 10px 8px}.qn-nav{display:flex;flex-direction:column;gap:8px}.qn-nav a{display:block;text-decoration:none;color:#aeb9d0;border:1px solid #263250;background:#11182b;border-radius:10px;padding:11px 12px;font-size:12px;font-weight:700}.qn-nav a.active{border-color:#6f86b5;background:#18243d;color:#fff}.qn-nav small{display:block;color:#69758f;font-weight:500;margin-top:4px;font-size:10px}.qn-drawer-note{margin-top:auto;border-top:1px solid #202b46;padding:12px 10px;color:#69758f;font-size:10px;line-height:1.5}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:14px}.qn-drawer{width:220px}}
</style></head><body>
<button class="qn-drawer-toggle" id="toggle">☰</button><aside class="qn-drawer" id="drawer"><div class="qn-drawer-title">QuantNifty Next</div><div class="qn-drawer-sub">Choose the data view</div><nav class="qn-nav"><a href="/intelligence">Market Intelligence<small>Market state, events &amp; decisions</small></a><a href="/">Raw Data<small>Live provider market &amp; option-chain data</small></a><a class="active" href="/backtest">Backtest &amp; Validation<small>OOS performance, risk &amp; regime validation</small></a></nav><div class="qn-drawer-note">Research-only mode · no orders are placed, modified or cancelled.</div></aside>
<main><div class="top"><div><h1>Backtest &amp; Validation</h1><div class="sub">Same Institutional Signal → Risk → Final Decision → Execution Plan path · read-only</div></div><div id="status" class="pill">Awaiting historical snapshots</div></div>
<div class="panel warn"><b>Research-only validation</b><div class="note">This screen never places trades. Historical performance is calculated only from supplied option-chain snapshots. It will not fabricate results from index candles when option-chain state is unavailable.</div></div>
<div class="panel"><div class="toolbar"><div class="field">Strategy<select id="strategy"><option value="directional">Directional</option><option value="gamma_blast">Gamma Blast</option></select></div><div class="field">Initial capital<input id="capital" type="number" value="100000" min="1"></div><div class="field">Lot size<input id="lot" type="number" value="1" min="1"></div><div class="field">Max hold bars<input id="hold" type="number" value="12" min="1"></div><div class="field">Stop %<input id="stop" type="number" value="1.25" step="0.05"></div><div class="field">Target %<input id="target" type="number" value="2.5" step="0.05"></div><button class="button" id="run">Run validation</button></div><div class="note" style="margin-top:12px">The API expects ordered MarketSnapshot objects. Decision at t is filled using the next available quote at t+1; bid/ask-aware fills and configured slippage/fixed costs are applied.</div></div>
<div class="grid"><div id="overall" class="panel"><div class="muted">Overall</div><div class="big">—</div><div class="metric"><span>Trades</span><b>—</b></div></div><div id="oos" class="panel"><div class="muted">Out of Sample</div><div class="big">—</div><div class="metric"><span>Net P&amp;L</span><b>—</b></div></div><div id="risk" class="panel"><div class="muted">Risk Gate</div><div class="big">—</div><div class="metric"><span>Blocked</span><b>—</b></div></div><div id="safety" class="panel good"><div class="muted">Execution Safety</div><div class="big">READ ONLY</div><div class="metric"><span>Orders placed</span><b>0</b></div></div></div>
<div class="panel"><div class="big" style="font-size:18px">Performance Metrics</div><div id="metrics" class="grid"></div></div><div class="panel"><div class="big" style="font-size:18px">Regime Validation</div><div class="tablewrap"><table class="table"><thead><tr><th>Regime</th><th>Trades</th><th>Win %</th><th>Net P&amp;L</th><th>Max DD</th><th>Expectancy</th></tr></thead><tbody id="regimes"><tr><td colspan="6" class="muted">Run validation with recorded snapshots.</td></tr></tbody></table></div></div>
<div class="panel"><div class="big" style="font-size:18px">Validation Contract</div><div id="contract" class="note">Lookahead-free execution, OOS split, cost model, drawdown, win/loss distribution, risk-gate effectiveness and expiry-day classification are implemented in the backend. Empirical results appear only when genuine historical option-chain snapshots are supplied.</div></div>
</main><script>
const $=id=>document.getElementById(id);const n=(v,d=2)=>v==null||Number.isNaN(Number(v))?'—':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d});
function metricCards(m){const keys=[['Win rate','win_rate_pct','%'],['Profit factor','profit_factor',''],['Expectancy','expectancy_per_trade',''],['Avg win','avg_win',''],['Avg loss','avg_loss',''],['Max drawdown','max_drawdown',''],['Max DD %','max_drawdown_pct','%'],['Sharpe-like','sharpe_like',''],['Return','return_pct','%'],['Costs','costs','']];$('metrics').innerHTML=keys.map(([a,k,u])=>'<div class="panel" style="margin:0"><div class="muted">'+a+'</div><div class="big">'+n(m[k])+u+'</div></div>').join('')}
function render(r){if(!r||r.status!=='OK'){ $('status').textContent=r&&r.status?r.status:'Validation unavailable'; return } const m=r.metrics||{},o=(r.split||{}).out_of_sample||{};$('status').textContent='Validation complete · '+r.strategy+' · lookahead-free='+r.lookahead_free;$('overall').innerHTML='<div class="muted">Overall</div><div class="big">'+n(m.net_pnl)+'</div><div class="metric"><span>Trades</span><b>'+n(m.trades,0)+'</b></div><div class="metric"><span>Win rate</span><b>'+n(m.win_rate_pct)+'%</b></div>';$('oos').innerHTML='<div class="muted">Out of Sample</div><div class="big">'+n(o.net_pnl)+'</div><div class="metric"><span>Trades</span><b>'+n(o.trades,0)+'</b></div><div class="metric"><span>Win rate</span><b>'+n(o.win_rate_pct)+'%</b></div>';$('risk').innerHTML='<div class="muted">Risk Gate</div><div class="big">'+n(r.approved,0)+' approved</div><div class="metric"><span>Blocked</span><b>'+n(r.blocked,0)+'</b></div>';$('safety').className='panel good';metricCards(m);const regs=r.regimes||{};$('regimes').innerHTML=Object.entries(regs).map(([k,v])=>'<tr><td>'+k+'</td><td>'+n(v.trades,0)+'</td><td>'+n(v.win_rate_pct)+'%</td><td>'+n(v.net_pnl)+'</td><td>'+n(v.max_drawdown)+'</td><td>'+n(v.expectancy_per_trade)+'</td></tr>').join('')||'<tr><td colspan="6">No trades in supplied data.</td></tr>';}
async function run(){try{const data=window.__snapshots;if(!Array.isArray(data)||data.length<2){$('status').textContent='No historical option-chain snapshots loaded';return}const payload={snapshots:data,strategy:$('strategy').value,config:{initial_capital:Number($('capital').value),lot_size:Number($('lot').value),max_hold_bars:Number($('hold').value),stop_pct:Number($('stop').value)/100,target_pct:Number($('target').value)/100}};const r=await fetch('/api/v1/validation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});render(await r.json())}catch(e){$('status').textContent='Validation error: '+e.message}}
$('run').onclick=run;fetch('/api/v1/status').then(r=>r.json()).then(s=>{if(s.backtest==='AVAILABLE')$('status').textContent='Backtest engine available · load recorded snapshots to run'}).catch(()=>{});$('toggle').onclick=()=>$('drawer').classList.toggle('open');
</script></body></html>''')
          PY
      - name: Run tests
        run: |
          python -m pip install -e ./apps/api
          python -m pytest -q
      - name: Commit implementation and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/main.py apps/api/src/quantnifty/web/index.html apps/api/src/quantnifty/web/intelligence.html apps/api/src/quantnifty/web/backtest.html
          git rm .github/workflows/implement-backtest-ui.yml
          git commit -m "Add Backtest and Validation screen"
          git push