name: Add continuous market refresh loop
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/implement-continuous-market-loop.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add server refresh loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/quantnifty/main.py')
          s=p.read_text()
          if 'async def continuous_market_refresh()' not in s:
              anchor='\n\n@app.get("/")\n'
              helper='''\n\nasync def continuous_market_refresh():\n    """Continuously refresh provider state while the Render instance is running."""\n    while True:\n        try:\n            await snapshot()\n        except Exception:\n            # Keep the service alive; the next cycle retries provider access.\n            pass\n        await asyncio.sleep(POLL_SECONDS)\n\n\n@app.on_event("startup")\nasync def start_background_refresh():\n    app.state.market_refresh_task = asyncio.create_task(continuous_market_refresh())\n\n\n@app.on_event("shutdown")\nasync def stop_background_refresh():\n    task = getattr(app.state, "market_refresh_task", None)\n    if task:\n        task.cancel()\n        try:\n            await task\n        except asyncio.CancelledError:\n            pass\n'''
              if anchor not in s:
                  raise SystemExit('root anchor not found')
              s=s.replace(anchor, helper+anchor, 1)
              p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > apps/api/tests/test_continuous_refresh.py <<'PY'
          from pathlib import Path

          def test_continuous_refresh_loop_is_configured():
              source = Path('apps/api/src/quantnifty/main.py').read_text()
              assert 'async def continuous_market_refresh()' in source
              assert 'asyncio.create_task(continuous_market_refresh())' in source
              assert 'await asyncio.sleep(POLL_SECONDS)' in source
              assert 'app.state.market_refresh_task.cancel()' in source
          PY
          python -m compileall -q apps/api/src
          pip install -e ./apps/api pytest -q
          pytest -q apps/api/tests
      - name: Commit implementation and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/quantnifty/main.py apps/api/tests/test_continuous_refresh.py
          git commit -m 'Enable continuous provider market refresh' || true
          git push
          git rm .github/workflows/implement-continuous-market-loop.yml
          git commit -m 'Remove one-time refresh workflow'
          git push
