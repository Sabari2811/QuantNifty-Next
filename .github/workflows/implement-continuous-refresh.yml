name: Implement recorded historical validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/implement-continuous-refresh.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire recording loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          api=Path('apps/api/src/quantnifty/recording_api.py')
          api.write_text('''from __future__ import annotations\n\nimport os\nfrom dataclasses import fields\nfrom pathlib import Path\nfrom typing import Any\nfrom fastapi import APIRouter, HTTPException\nfrom quantnifty.backtest import BacktestConfig, validation_report\nfrom quantnifty.recording_loader import load_recording\n\nrouter = APIRouter(prefix="/api/v1/recording", tags=["historical-validation"])\n\ndef _root() -> Path | None:\n    value=(os.getenv("QUANTNIFTY_RECORDING_ROOT") or os.getenv("RECORDING_ROOT") or "").strip()\n    return Path(value) if value else None\n\ndef _cfg(raw: dict[str, Any]) -> BacktestConfig:\n    allowed={f.name for f in fields(BacktestConfig)}\n    try: return BacktestConfig(**{k:raw[k] for k in raw if k in allowed})\n    except (TypeError,ValueError) as exc: raise HTTPException(400,f"invalid backtest configuration: {exc}") from exc\n\n@router.get("/status")\ndef recording_status():\n    root=_root()\n    if root is None: return {"status":"NOT_CONFIGURED","configured":False,"root":None,"bundles":0}\n    if not root.exists(): return {"status":"PATH_UNAVAILABLE","configured":True,"root":str(root),"bundles":0}\n    bundles=sorted({p.parent for p in root.rglob("runtime.json")})\n    return {"status":"AVAILABLE" if bundles else "NO_BUNDLES","configured":True,"root":str(root),"bundles":len(bundles)}\n\n@router.get("/snapshots")\ndef recording_snapshots():\n    root=_root()\n    if root is None: raise HTTPException(503,"historical recording root is not configured")\n    try: snapshots=load_recording(root)\n    except (OSError,RuntimeError,ValueError) as exc: raise HTTPException(503,f"historical recording unavailable: {exc}") from exc\n    return {"status":"OK","mode":"READ_ONLY_RECORDED_HISTORICAL","observations":len(snapshots),"snapshots":snapshots}\n\n@router.post("/validation")\ndef recording_validation(payload: dict[str,Any]):\n    root=_root()\n    if root is None: raise HTTPException(503,"historical recording root is not configured")\n    strategy=str(payload.get("strategy") or "directional").strip().lower()\n    if strategy not in {"directional","gamma_blast"}: raise HTTPException(400,"strategy must be directional or gamma_blast")\n    try: result=validation_report(load_recording(root),strategy,_cfg(payload.get("config") or {}))\n    except (OSError,RuntimeError,ValueError) as exc: raise HTTPException(503,f"historical validation unavailable: {exc}") from exc\n    result.update({"source":"RECORDED_HISTORICAL","recording_root":str(root),"empirical":result.get("status")=="OK" and result.get("historical_data",{}).get("status")=="VALID_HISTORICAL"})\n    return result\n''', encoding='utf-8')
          main=Path('apps/api/src/quantnifty/main.py')
          s=main.read_text()
          if 'from quantnifty.recording_api import router as recording_router' not in s:
              s=s.replace('from quantnifty.backtest import BacktestConfig, run_backtest, validation_report\n','from quantnifty.backtest import BacktestConfig, run_backtest, validation_report\nfrom quantnifty.recording_api import router as recording_router\n')
          if 'app.include_router(recording_router)' not in s:
              s=s.replace('cache: dict[str, Any] = {"snapshot": None, "previous_snapshot": None, "updated_at": None}\n','cache: dict[str, Any] = {"snapshot": None, "previous_snapshot": None, "updated_at": None}\napp.include_router(recording_router)\n')
          main.write_text(s, encoding='utf-8')
          ui=Path('apps/api/src/quantnifty/web/backtest.html')
          u=ui.read_text(encoding='utf-8')
          u=u.replace('fetch(\'/api/v1/status\').then(r=>r.json()).then(s=>{if(s.backtest===\'AVAILABLE\')$(\'status\').textContent=\'Backtest engine available · awaiting recorded snapshots\'}).catch(()=>{});', 'fetch(\'/api/v1/recording/status\').then(r=>r.json()).then(s=>{if(s.status===\'AVAILABLE\')$(\'status\').textContent=\'Recorded history available · \'+s.bundles+\' bundles\';else $(\'status\').textContent=\'Historical recording: \'+s.status}).catch(()=>{});')
          old='if(!Array.isArray(window.__snapshots)||window.__snapshots.length<2){$(\'status\').textContent=\'No historical option-chain snapshots loaded\';return}let p={snapshots:window.__snapshots,strategy:$(\'strategy\').value,config:'
          new='let p={strategy:$(\'strategy\').value,config:'
          u=u.replace(old,new)
          u=u.replace('render(await (await fetch(\'/api/v1/validation\',{method:\'POST\',headers:{\'Content-Type\':\'application/json\'},body:JSON.stringify(p)})).json())', 'render(await (await fetch(\'/api/v1/recording/validation\',{method:\'POST\',headers:{\'Content-Type\':\'application/json\'},body:JSON.stringify(p)})).json())')
          ui.write_text(u, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q apps/api/src
          pip install -e ./apps/api pytest -q
          pytest -q apps/api/tests
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/quantnifty/main.py apps/api/src/quantnifty/recording_api.py apps/api/src/quantnifty/web/backtest.html
          git diff --cached --quiet || git commit -m 'Wire recorded historical validation'
          git push
          git rm .github/workflows/implement-continuous-refresh.yml
          git commit -m 'Remove one-time historical validation workflow'
          git push
