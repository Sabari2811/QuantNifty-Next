name: QuantNifty Live Validation Harness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantnifty-live-validation
  cancel-in-progress: true

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate live provider, snapshot recorder, decisions, and learning
        shell: bash
        env:
          BASE_URL: https://quantnifty-api.onrender.com
          STOP_AT_IST: '16:00'
          MAX_SNAPSHOT_AGE_SECONDS: '90'
        run: |
          set -u
          echo "LIVE_VALIDATION_HARNESS=START"
          echo "UTC=$(date -u --iso-8601=seconds)"
          echo "IST=$(TZ=Asia/Kolkata date --iso-8601=seconds)"
          echo "This harness is a temporary validation aid for the Render Free-plan idle limitation."
          echo "It does not place orders or alter trading permissions."

          end_epoch="$(TZ=Asia/Kolkata date -d "$(date +%F) ${STOP_AT_IST}:00" +%s)"
          baseline_snapshots=-1
          baseline_decisions=-1

          while [ "$(date +%s)" -lt "$end_epoch" ]; do
            now_ist="$(TZ=Asia/Kolkata date --iso-8601=seconds)"
            echo "--- $now_ist ---"

            health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 45 "$BASE_URL/health" || true)"
            echo "HEALTH_HTTP=$health_code"
            test "$health_code" = "200"

            # Force one real live-provider read. This proves provider connectivity independently
            # of the background refresh task and never places or modifies an order.
            market_code="$(curl -sS -o /tmp/market.json -w '%{http_code}' --max-time 45 "$BASE_URL/api/v1/market" || true)"
            echo "MARKET_HTTP=$market_code"
            test "$market_code" = "200"
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/market.json').read_text())
          assert data.get('data_integrity') == 'LIVE_PROVIDER', data
          assert float(data.get('spot') or 0) > 0, data
          assert int(data.get('rows') or 0) >= 2, data
          assert data.get('timestamp'), data
          print('LIVE_PROVIDER_SNAPSHOT=VALID')
          print('LIVE_PROVIDER_TIMESTAMP=', data.get('timestamp'))
          print('LIVE_PROVIDER_ROWS=', data.get('rows'))
          print('LIVE_PROVIDER_SPOT=', data.get('spot'))
          PY

            status_code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 45 "$BASE_URL/api/v1/status" || true)"
            echo "STATUS_HTTP=$status_code"
            test "$status_code" = "200"
            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('/tmp/status.json').read_text())
          assert data.get('cached') is True, data
          updated=data.get('updated_at')
          assert updated, data
          ts=datetime.fromtimestamp(float(updated), tz=timezone.utc)
          age=(datetime.now(timezone.utc)-ts).total_seconds()
          max_age=float(os.environ.get('MAX_SNAPSHOT_AGE_SECONDS','90'))
          assert age <= max_age, f'stale live snapshot: age={age:.1f}s max={max_age:.1f}s status={data}'
          learning=data.get('learning') or {}
          assert learning.get('configured') is True, learning
          assert learning.get('durability') == 'POSTGRESQL', learning
          assert learning.get('database_available') is True, learning
          snapshots=int(learning.get('snapshots') or 0)
          decisions=int(learning.get('decisions') or 0)
          print('RUNTIME_CACHED=', data.get('cached'))
          print('RUNTIME_UPDATED_AT=', updated)
          print('LIVE_SNAPSHOT_AGE_SECONDS=', round(age,1))
          print('LEARNING_DURABILITY=', learning.get('durability'))
          print('LEARNING_DATABASE_AVAILABLE=', learning.get('database_available'))
          print('LEARNING_SNAPSHOTS=', snapshots)
          print('LEARNING_DECISIONS=', decisions)
          print('LIVE_PAPER_STATUS=', data.get('live_paper_status'))
          Path('/tmp/counts').write_text(f'{snapshots} {decisions}\n')
          PY

            read -r snapshots decisions < /tmp/counts
            if [ "$baseline_snapshots" -lt 0 ]; then
              baseline_snapshots="$snapshots"
              baseline_decisions="$decisions"
              echo "LEARNING_BASELINE snapshots=$baseline_snapshots decisions=$baseline_decisions"
            else
              if [ "$snapshots" -lt "$baseline_snapshots" ]; then
                echo "ERROR: snapshot count regressed" >&2
                exit 1
              fi
              if [ "$decisions" -lt "$baseline_decisions" ]; then
                echo "ERROR: decision count regressed" >&2
                exit 1
              fi
            fi

            sleep 60
          done

          echo "LIVE_VALIDATION_HARNESS=END"
