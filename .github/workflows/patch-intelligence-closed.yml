name: One-time Intelligence Closed UI Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch closed-session websocket lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/quantnifty/web/intelligence.html')
          s=p.read_text(encoding='utf-8')
          old1="let reconnectTimer=null;function connect(){if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/market');ws.onopen=()=>{$('status').textContent=window.qnMarketClosed?'MARKET CLOSED · live stream paused':'LIVE STREAM CONNECTED'};ws.onmessage=e=>{try{const data=JSON.parse(e.data);if(data.error){if(!window.qnMarketClosed)$('status').textContent='Live stream error: '+data.error;return}safeRender(data)}catch(error){showUiError(error)}};ws.onclose=()=>{if(window.qnMarketClosed){$('status').textContent='MARKET CLOSED · live stream paused';return}$('status').textContent='Live stream reconnecting…';reconnectTimer=setTimeout(connect,3000)};ws.onerror=()=>ws.close()}"
          new1="let reconnectTimer=null;let qnSocketConnected=false;function connect(){if(window.qnMarketClosed||qnSocketConnected)return;if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/market');ws.onopen=()=>{qnSocketConnected=true;$('status').textContent=window.qnMarketClosed?'MARKET CLOSED · live stream paused':'LIVE STREAM CONNECTED'};ws.onmessage=e=>{try{const data=JSON.parse(e.data);if(data.error){if(!window.qnMarketClosed)$('status').textContent='Live stream error: '+data.error;return}safeRender(data)}catch(error){showUiError(error)}};ws.onclose=()=>{qnSocketConnected=false;if(window.qnMarketClosed){$('status').textContent='MARKET CLOSED · live stream paused';return}$('status').textContent='Live stream reconnecting…';reconnectTimer=setTimeout(connect,3000)};ws.onerror=()=>ws.close()}"
          old2="safeRender(await r.json());return"
          new2="const payload=await r.json();safeRender(payload);if(!window.qnMarketClosed)connect();return"
          old3="window.qnMarketClosed=false;initial();connect();refreshTradeSignal();setInterval(refreshTradeSignal,5000);"
          new3="window.qnMarketClosed=false;initial();refreshTradeSignal();setInterval(refreshTradeSignal,5000);"
          if old1 not in s: raise SystemExit('connect block not found')
          if old2 not in s: raise SystemExit('initial success block not found')
          if old3 not in s: raise SystemExit('startup block not found')
          s=s.replace(old1,new1).replace(old2,new2).replace(old3,new3)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/quantnifty/web/intelligence.html
          git diff --cached --quiet && exit 0
          git commit -m 'Stop intelligence live socket when market is closed [skip ci]'
          git push
