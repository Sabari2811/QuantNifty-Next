name: QuantNifty Production Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke-test dependencies
        run: pip install requests websocket-client playwright
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Wait for production deployment
        run: |
          python - <<'PY'
          import time, requests
          base='https://quantnifty-api.onrender.com'
          for i in range(60):
              try:
                  r=requests.get(base+'/health',timeout=15)
                  if r.ok:
                      print('production health:', r.status_code, r.text)
                      break
              except Exception as e:
                  print('waiting:', e)
              time.sleep(10)
          else:
              raise SystemExit('production health endpoint did not become reachable')
          PY
      - name: Authenticated live-market and historical replay evidence
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timezone, timedelta
          import requests
          base='https://quantnifty-api.onrender.com'

          def get_json(path, *, params=None, timeout=45, attempts=6):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      response = requests.get(base + path, params=params, timeout=timeout)
                      if response.ok:
                          return response.json()
                      last = f'{response.status_code}: {response.text[:300]}'
                  except Exception as exc:
                      last = repr(exc)
                  print(f'retry {attempt}/{attempts} for {path}: {last}')
                  time.sleep(min(10, attempt * 2))
              raise SystemExit(f'{path} did not become available: {last}')

          health=get_json('/health', timeout=30)
          assert health['status']=='ok'
          assert health['provider']=='INDstocks'
          assert health['provider_configured'] is True

          market=get_json('/api/v1/market', timeout=45, attempts=8)
          assert market['data_integrity']=='LIVE_PROVIDER', market
          assert float(market['spot'])>0
          assert len(market['option_chain'])>=2
          assert market['rows']==len(market['option_chain'])
          print('LIVE_MARKET_EVIDENCE=PASS')
          print('spot=',market['spot'],'rows=',market['rows'],'expiry=',market.get('expiry'))

          end=int(datetime.now(timezone.utc).timestamp()*1000)
          start=int((datetime.now(timezone.utc)-timedelta(days=3)).timestamp()*1000)
          hist=get_json('/api/v1/historical',params={'interval':'5minute','start_time':start,'end_time':end,'scrip_codes':'NSE_40000001'},timeout=45,attempts=8)
          provider=hist['data']
          raw=provider.get('data') or {}
          series=raw.get('NSE_40000001') or {}
          candles=series.get('candles') or []
          assert len(candles)>=2, 'provider returned fewer than 2 candles'
          replay=None
          last=None
          for attempt in range(1, 7):
              try:
                  response=requests.post(base+'/api/v1/replay',json={'data':raw},timeout=45)
                  if response.ok:
                      replay=response.json()
                      break
                  last=f'{response.status_code}: {response.text[:300]}'
              except Exception as exc:
                  last=repr(exc)
              print(f'replay retry {attempt}/6: {last}')
              time.sleep(min(10, attempt * 2))
          if replay is None:
              raise SystemExit(f'/api/v1/replay did not become available: {last}')
          assert replay['mode']=='READ_ONLY_REPLAY'
          assert replay['summary']['count']==len(candles)
          assert replay['summary']['count']>=2
          print('PRODUCTION_REPLAY_EVIDENCE=PASS')
          print('candles=',len(candles),'replay_points=',len(replay['points']))
          PY
      - name: Browser E2E against production
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          base='https://quantnifty-api.onrender.com/'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()

              page.goto(base+'backtest.html', wait_until='networkidle', timeout=60000)
              assert page.url.rstrip('/').endswith('/backtest'), page.url
              assert 'Backtest & Validation' in page.locator('body').inner_text()
              print('BACKTEST_ROUTE_E2E=PASS')

              page.goto(base+'intelligence', wait_until='networkidle', timeout=60000)
              drawer=page.locator('#qnDrawer')
              nav=page.locator('[data-qn-nav="backtest"]')
              assert nav.count()==1
              assert 'Backtest & Validation' in nav.inner_text()
              if 'open' not in (drawer.get_attribute('class') or '').split():
                  page.locator('#qnDrawerToggle').click()
              assert nav.is_visible()
              nav.click()
              page.wait_for_load_state('networkidle')
              assert page.url.rstrip('/').endswith('/backtest'), page.url
              assert 'Backtest & Validation' in page.locator('body').inner_text()
              print('INTELLIGENCE_BACKTEST_NAV_E2E=PASS')

              page.goto(base, wait_until='networkidle', timeout=60000)
              page.wait_for_function("document.body.innerText.includes('LIVE_PROVIDER')", timeout=60000)
              text=page.locator('body').inner_text()
              for label in ['QuantNifty Next','Market Snapshot','Key Market Levels','Market Level Map','Gamma Walls','Expected Move Range','Market Structure','Dealer Flow','Directional Score','Positioning & Volatility','Reference Levels & Feed','Market Intelligence Data','Live Option Chain','Data Integrity','Security ID','Theta','Vega','CE Gamma Contribution','PE Gamma Contribution','CE IV %','PE IV %','CE OI Δ','PE OI Δ']:
                  assert label in text, f'missing UI label: {label}'
              assert 'Market Intelligence Charts' not in text
              assert 'OI Distribution' not in text
              assert 'Gamma Profile' not in text
              assert 'IV Smile' not in text
              assert 'Dealer Positioning' not in text
              assert 'LIVE_PROVIDER' in text
              assert 'No mock values are rendered' in text
              assert page.locator('#intelligenceBody tr').count() >= 2
              assert page.locator('#intelligenceBody td').count() >= 18
              assert page.locator('#chainBody tr').count() >= 2
              page.locator('#callsBtn').click()
              page.wait_for_timeout(500)
              assert page.locator('#chainBody tr').count() >= 1
              page.locator('#putsBtn').click()
              page.wait_for_timeout(500)
              assert page.locator('#chainBody tr').count() >= 1
              page.locator('#allBtn').click()
              page.wait_for_timeout(500)
              assert page.locator('#chainBody tr').count() >= 2
              print('BROWSER_E2E_EVIDENCE=PASS')
              browser.close()
          PY
