name: Replace intelligence charts with data table

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace charts with provider-bound table
        shell: python
        run: |
          from pathlib import Path

          html_path = Path("apps/api/src/quantnifty/web/index.html")
          text = html_path.read_text(encoding="utf-8")

          chart_start = text.index('<div class="section"><h2>Market Intelligence Charts</h2>')
          chain_start = text.index('<div class="section"><div class="chain-head">', chart_start)
          replacement = '''<div class="section">
          <h2>Market Intelligence Data</h2>
          <div class="intelligence-note">Strike-level provider data replacing the charts: open interest, gamma contribution, implied volatility and OI change. All values are derived from the same normalized live option chain.</div>
          <div class="intelligence-wrap"><table class="intelligence-table"><thead><tr>
          <th>Strike</th><th>CE OI</th><th>PE OI</th><th>CE Gamma Contribution</th><th>PE Gamma Contribution</th><th>CE IV %</th><th>PE IV %</th><th>CE OI Δ</th><th>PE OI Δ</th>
          </tr></thead><tbody id="intelligenceBody"><tr><td colspan="9" class="chain-empty">No provider option-chain data.</td></tr></tbody></table></div>
          </div>
          '''
          text = text[:chart_start] + replacement + text[chain_start:]

          # Remove the entire chart-only style block from .chart-grid through .level-map.
          css_start = text.index('.chart-grid{')
          css_end = text.index('.level-map{', css_start)
          text = text[:css_start] + text[css_end:]

          table_css = '''
          /* Market intelligence data table: same provider-derived values as the former charts */
          .intelligence-wrap{overflow:auto;border:1px solid #263250;border-radius:12px;background:#0d1425}
          .intelligence-table{width:100%;min-width:1180px;border-collapse:collapse;font-size:11px}
          .intelligence-table th{position:sticky;top:0;z-index:2;background:#162038;color:#8e9ab5;font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid #33405e;white-space:nowrap}
          .intelligence-table th:first-child,.intelligence-table td:first-child{text-align:left}
          .intelligence-table td{padding:8px 10px;border-bottom:1px solid #202b46;text-align:right;white-space:nowrap}
          .intelligence-table tbody tr:nth-child(even){background:#111a2d}
          .intelligence-table tbody tr.atm{background:#1a2743}
          .intelligence-table tbody tr.atm td:first-child{font-weight:800}
          .intelligence-table .negative{font-weight:650}
          .intelligence-table .positive{font-weight:650}
          .intelligence-note{font-size:11px;color:#7d89a4;margin:-5px 0 10px}
          @media(max-width:900px){.intelligence-table{min-width:1080px}}
          '''
          text = text.replace('</style>', table_css + '</style>', 1)

          start = text.index("function shortNum(v)")
          end = text.index("function renderLevelMap", start)
          table_js = '''function intelligenceRows(rows){const by=new Map();rows.forEach(r=>{const strike=Number(r.strike);if(!Number.isFinite(strike))return;const side=r.side==='CE'?'CE':'PE';const oi=Number(r.oi),prev=Number(r.previous_oi),gamma=Number(r.gamma),iv=Number(r.iv);const item=by.get(strike)||{strike,CE:{},PE:{}};item[side]={oi:Number.isFinite(oi)?oi:null,oi_change:Number.isFinite(oi)&&Number.isFinite(prev)?oi-prev:null,gamma_contribution:Number.isFinite(gamma)&&Number.isFinite(oi)?gamma*oi*(side==='CE'?-1:1):null,iv:Number.isFinite(iv)?iv:null};by.set(strike,item)});return[...by.values()].sort((a,b)=>a.strike-b.strike)}
          function renderIntelligence(rows){const body=$('intelligenceBody'),items=intelligenceRows(rows);if(!items.length){body.innerHTML='<tr><td colspan="9" class="chain-empty">No provider option-chain data.</td></tr>';return}const spot=Number(window.__spot);const atm=Number.isFinite(spot)?items.reduce((best,item)=>Math.abs(item.strike-spot)<Math.abs(best.strike-spot)?item:best,items[0]).strike:null;const cell=(v,d=0)=>Number.isFinite(v)?esc(n(v,d)):'—';body.innerHTML=items.map(item=>{const ce=item.CE,pe=item.PE,isAtm=atm!==null&&item.strike===atm;return `<tr class="${isAtm?'atm':''}"><td>${esc(n(item.strike,0))}</td><td>${cell(ce.oi)}</td><td>${cell(pe.oi)}</td><td class="negative">${cell(ce.gamma_contribution)}</td><td class="positive">${cell(pe.gamma_contribution)}</td><td>${cell(ce.iv,2)}</td><td>${cell(pe.iv,2)}</td><td class="negative">${cell(ce.oi_change)}</td><td class="positive">${cell(pe.oi_change)}</td></tr>`}).join('')}
          '''
          text = text[:start] + table_js + text[end:]
          text = text.replace('renderCharts([]);', 'renderIntelligence([]);')
          text = text.replace('currentChain=Array.isArray(d.option_chain)?d.option_chain:[];chainRows(currentChain);renderCharts(currentChain);', 'currentChain=Array.isArray(d.option_chain)?d.option_chain:[];chainRows(currentChain);renderIntelligence(currentChain);')
          text = text.replace("window.addEventListener('resize',()=>{if(currentChain.length)renderCharts(currentChain)});", '')
          text = text.replace('All dashboard charts above are derived from this same normalized provider chain.', 'Market intelligence data above is derived from this same normalized provider chain.')
          text = text.replace('The full normalized INDstocks option chain remains the analytics source and is also exposed here for transparent inspection. Market intelligence, levels, positioning, volatility, dealer flow, scoring and reference levels are derived from the same normalized rows.', 'The full normalized INDstocks option chain remains the analytics source and is also exposed here for transparent inspection. Market intelligence, levels, positioning, volatility, dealer flow, scoring and reference levels are derived from the same normalized rows. Strike-level intelligence is shown as data in a table rather than charts.')
          html_path.write_text(text, encoding="utf-8")

          test_path = Path("apps/api/tests/test_dashboard_ui_contract.py")
          test_path.write_text('''from pathlib import Path\n\n\nHTML = Path(__file__).parents[1] / "src" / "quantnifty" / "web" / "index.html"\n\n\ndef test_dashboard_retains_legacy_live_option_chain_details():\n    text = HTML.read_text(encoding="utf-8")\n    required = [\n        "Live Option Chain", "All", "Calls", "Puts", "ATM", "Side", "Strike", "Security ID",\n        "LTP", "Prev Close", "OI", "OI Δ", "Volume", "Bid", "Bid Qty", "Ask", "Ask Qty",\n        "IV %", "Delta", "Gamma", "Theta", "Vega", "Data Integrity",\n    ]\n    for label in required:\n        assert label in text, f"missing dashboard detail: {label}"\n\n\ndef test_dashboard_retains_all_current_analytics_sections():\n    text = HTML.read_text(encoding="utf-8")\n    required = [\n        "Market Snapshot", "Key Market Levels", "Market Level Map", "Gamma Walls", "Expected Move Range",\n        "Market Structure", "Dealer Flow", "Directional Score", "Positioning & Volatility",\n        "Reference Levels & Feed", "Market Intelligence Data", "Vanna Proxy", "IV Skew", "Gamma Flip",\n        "Max Pain", "Liquidity", "Bullish Score", "Bearish Score", "CE Gamma Contribution",\n        "PE Gamma Contribution", "CE IV %", "PE IV %", "CE OI Δ", "PE OI Δ",\n    ]\n    for label in required:\n        assert label in text, f"missing analytics UI detail: {label}"\n\n\ndef test_dashboard_binds_table_and_chain_to_provider_payload():\n    text = HTML.read_text(encoding="utf-8")\n    assert "d.option_chain" in text\n    assert "currentChain=Array.isArray(d.option_chain)?d.option_chain:[]" in text\n    assert "renderIntelligence(currentChain)" in text\n    assert "intelligenceRows(rows)" in text\n    assert "gamma_contribution" in text\n    assert "LIVE_PROVIDER" in text\n    assert "No mock values are rendered" in text\n\n\ndef test_dashboard_level_map_is_simple_and_provider_bound():\n    text = HTML.read_text(encoding="utf-8")\n    assert "levelMapList" in text\n    assert "level-item" in text\n    assert "items.length?items.map" in text\n    assert "sort((a,b)=>Number(a[1])-Number(b[1]))" in text\n    assert "$('levelMapList').innerHTML='<div class=\\"muted\\">No provider market levels</div>';" in text\n    assert "class=\\"marker\\"" not in text\n\n\ndef test_market_intelligence_uses_simple_data_table_instead_of_charts():\n    text = HTML.read_text(encoding="utf-8")\n    assert "Market Intelligence Data" in text\n    assert "Market Intelligence Charts" not in text\n    assert "oiChart" not in text\n    assert "gammaChart" not in text\n    assert "ivChart" not in text\n    assert "flowChart" not in text\n    assert "chart-grid" not in text\n    assert "chart-panel" not in text\n    assert "intelligenceBody" in text\n    assert "CE Gamma Contribution" in text\n    assert "PE Gamma Contribution" in text\n    assert "CE IV %" in text\n    assert "PE IV %" in text\n    assert "CE OI Δ" in text\n    assert "PE OI Δ" in text\n''', encoding="utf-8")
      - name: Run dashboard regression tests
        run: |
          python -m pip install -e ./apps/api pytest
          python -m compileall -q apps/api/src
          pytest -q apps/api/tests/test_dashboard_ui_contract.py
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/web/index.html apps/api/tests/test_dashboard_ui_contract.py
          git rm .github/workflows/remove-charts-table.yml
          git commit -m "Replace market intelligence charts with data table"
          git push
