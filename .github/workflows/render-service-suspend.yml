name: QuantNifty Render Suspend

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  suspend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Suspend QuantNifty API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dad5e767bikc739oighg
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          curl --fail --silent --show-error             --request POST             --url "https://api.render.com/v1/services/${SERVICE_ID}/suspend"             --header "Authorization: Bearer ${RENDER_API_KEY}"             --header "Accept: application/json"

      - name: Suspend production PostgreSQL
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          POSTGRES_ID: dpg-dagismid0e5s73cmh38g-a
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          curl --fail --silent --show-error             --request POST             --url "https://api.render.com/v1/postgres/${POSTGRES_ID}/suspend"             --header "Authorization: Bearer ${RENDER_API_KEY}"             --header "Accept: application/json"
