name: Repair live intelligence transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair live intelligence transport'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch live transport and UI
        shell: python
        run: |
          from pathlib import Path
          main_path = Path('apps/api/src/quantnifty/main.py')
          text = main_path.read_text()
          old_market = '''@app.get("/api/v1/market")
async def market():
    try: return await snapshot()
    except Exception as exc: raise HTTPException(status_code=503,detail=str(exc)) from exc'''
          new_market = '''@app.get("/api/v1/market")
async def market():
    cached = cache.get("snapshot")
    if cached is not None:
        return cached
    try:
        return await snapshot()
    except Exception as exc:
        raise HTTPException(status_code=503, detail=str(exc)) from exc'''
          if old_market not in text: raise SystemExit('market endpoint pattern not found')
          text = text.replace(old_market, new_market, 1)
          old_ws = '''@app.websocket("/ws/market")
async def websocket_market(ws: WebSocket):
    await ws.accept()
    try:
        while True:
            try: data=await snapshot(); await ws.send_json(data)
            except Exception as exc: await ws.send_json({"error":str(exc),"mode":"READ_ONLY"})
            await asyncio.sleep(POLL_SECONDS)
    except WebSocketDisconnect: return'''
          new_ws = '''@app.websocket("/ws/market")
async def websocket_market(ws: WebSocket):
    await ws.accept()
    try:
        while True:
            try:
                data = cache.get("snapshot")
                if data is None:
                    data = await snapshot()
                await ws.send_json(data)
            except WebSocketDisconnect:
                return
            except Exception as exc:
                try:
                    await ws.send_json({"error": str(exc), "mode": "READ_ONLY"})
                except Exception:
                    return
            await asyncio.sleep(POLL_SECONDS)
    except WebSocketDisconnect:
        return'''
          if old_ws not in text: raise SystemExit('websocket endpoint pattern not found')
          text = text.replace(old_ws, new_ws, 1)
          main_path.write_text(text)

          html_path = Path('apps/api/src/quantnifty/web/intelligence.html')
          html = html_path.read_text()
          old_tail = '''initial();connect();refreshTradeSignal();setInterval(refreshTradeSignal,5000);'''
          new_tail = '''initial();connect();refreshTradeSignal();setInterval(refreshTradeSignal,5000);setInterval(()=>{if(document.visibilityState!=="hidden")initial()},10000);window.addEventListener("error",e=>{if($("status"))$("status").textContent="UI error: "+(e.message||"unknown client error")});window.addEventListener("unhandledrejection",e=>{if($("status"))$("status").textContent="UI error: "+(e.reason?.message||e.reason||"unhandled rejection")});'''
          if old_tail not in html: raise SystemExit('intelligence bootstrap pattern not found')
          html_path.write_text(html.replace(old_tail, new_tail, 1))

          handoff = Path('PROJECT_HANDOFF.md')
          h = handoff.read_text()
          marker = '## UI status — 2026-09-11\n'
          note = '''### Live Intelligence transport hardening — 2026-09-11
Production showed a healthy LIVE_PROVIDER cache while the Market Intelligence page remained on static placeholders. The transport is hardened so `/api/v1/market` serves the latest cached snapshot immediately when present, `/ws/market` streams the cached snapshot first, and browser-side bootstrap retries continue while the page is visible. Client-side errors are surfaced instead of remaining silently hidden. No decision, learning, paper-trade or real-execution logic changed; trading remains READ ONLY / DISABLED.

'''
          if note not in h: handoff.write_text(h.replace(marker, marker + note, 1))
      - name: Validate changed Python modules
        run: python -m compileall -q apps/api/src/quantnifty
      - name: Commit repaired transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/main.py apps/api/src/quantnifty/web/intelligence.html PROJECT_HANDOFF.md
          git commit -m "fix: repair live intelligence transport"
          git push
      - name: Remove temporary repair workflow
        run: |
          git rm .github/workflows/repair-live-intelligence.yml
          git commit -m "chore: remove temporary repair workflow"
          git push
