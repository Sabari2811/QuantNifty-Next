name: Add QuantNifty screen navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add screen drawer
        shell: python
        run: |
          from pathlib import Path

          css = r'''
          /* QuantNifty screen drawer */
          .qn-drawer-toggle{position:fixed;left:0;top:42%;z-index:1001;width:34px;height:76px;border:1px solid #33405e;border-left:0;border-radius:0 12px 12px 0;background:#111a2d;color:#e8edf7;cursor:pointer;box-shadow:0 8px 24px #0005;font-size:16px}
          .qn-drawer{position:fixed;left:0;top:0;bottom:0;z-index:1000;width:238px;padding:22px 14px;background:rgba(10,15,28,.98);border-right:1px solid #263250;box-shadow:16px 0 40px #0007;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;gap:12px}
          .qn-drawer.open{transform:translateX(0)}
          .qn-drawer-title{font-size:14px;font-weight:800;letter-spacing:.04em;padding:4px 10px 8px;color:#e8edf7}
          .qn-drawer-sub{font-size:10px;color:#69758f;padding:0 10px 8px}
          .qn-nav{display:flex;flex-direction:column;gap:8px}
          .qn-nav a{display:block;text-decoration:none;color:#aeb9d0;border:1px solid #263250;background:#11182b;border-radius:10px;padding:11px 12px;font-size:12px;font-weight:700}
          .qn-nav a:hover{border-color:#52698f;background:#15213a;color:#fff}
          .qn-nav a.active{border-color:#6f86b5;background:#18243d;color:#fff}
          .qn-nav small{display:block;color:#69758f;font-weight:500;margin-top:4px;font-size:10px}
          .qn-drawer-note{margin-top:auto;border-top:1px solid #202b46;padding:12px 10px;color:#69758f;font-size:10px;line-height:1.5}
          @media(max-width:600px){.qn-drawer{width:218px}.qn-drawer-toggle{top:35%;height:68px}}
          '''

          html = r'''
          <button class="qn-drawer-toggle" id="qnDrawerToggle" aria-label="Open screen navigation" title="Screen navigation">☰</button>
          <aside class="qn-drawer" id="qnDrawer" aria-label="QuantNifty screen navigation">
            <div class="qn-drawer-title">QuantNifty Next</div>
            <div class="qn-drawer-sub">Choose the data view</div>
            <nav class="qn-nav">
              <a data-qn-nav="intelligence" href="/intelligence">Market Intelligence<small>Market state, events &amp; decisions</small></a>
              <a data-qn-nav="raw" href="/">Raw Data<small>Live provider market &amp; option-chain data</small></a>
            </nav>
            <div class="qn-drawer-note">Read-only mode · no orders are placed, modified or cancelled.</div>
          </aside>
          '''

          js = r'''
          <script>
          (function(){
            const drawer=document.getElementById('qnDrawer'), toggle=document.getElementById('qnDrawerToggle');
            if(!drawer||!toggle)return;
            toggle.addEventListener('click',()=>drawer.classList.toggle('open'));
            drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>drawer.classList.remove('open')));
            const path=location.pathname;
            drawer.querySelector('[data-qn-nav="intelligence"]').classList.toggle('active',path==='/intelligence');
            drawer.querySelector('[data-qn-nav="raw"]').classList.toggle('active',path==='/'||path==='');
          })();
          </script>
          '''

          marker='<!-- QuantNifty screen drawer -->'
          for name in ['apps/api/src/quantnifty/web/index.html','apps/api/src/quantnifty/web/intelligence.html']:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if marker not in text:
                  text=text.replace('</style>', css+'\n</style>', 1)
                  text=text.replace('<body>', '<body>\n'+marker+'\n'+html, 1)
                  text=text.replace('</body>', js+'\n</body>', 1)
                  p.write_text(text, encoding='utf-8')

          for name in ['apps/api/src/quantnifty/web/index.html','apps/api/src/quantnifty/web/intelligence.html']:
              text=Path(name).read_text(encoding='utf-8')
              assert marker in text
              assert 'Market Intelligence' in text
              assert 'Raw Data' in text
              assert 'qn-drawer' in text

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/quantnifty/web/index.html apps/api/src/quantnifty/web/intelligence.html
          git commit -m "Add Market Intelligence and Raw Data screen drawer" || true
          git rm .github/workflows/sidebar_navigation.yml
          git commit -m "Remove one-time navigation workflow"
          git push
