name: Simplify Market Level Map

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify map markup and rendering
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/api/src/quantnifty/web/index.html')
          text = path.read_text(encoding='utf-8')

          old_css = re.search(r'\.level-map\{.*?\}\.level-map \.track\{.*?\}\.marker\{.*?\}\.marker i\{.*?\}\.marker strong\{.*?\}\.marker small\{.*?\}\.map-label\{.*?\}\.map-label\.left\{.*?\}\.map-label\.right\{.*?\}', text, re.S)
          if not old_css:
              raise SystemExit('level map CSS block not found')
          new_css = '.level-map{margin-top:14px;border:1px solid #263250;border-radius:12px;background:#0d1425;padding:10px}.level-map-list{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px}.level-item{background:#11182b;border:1px solid #263250;border-radius:9px;padding:10px 8px;text-align:center}.level-item .name{display:block;color:#8e9ab5;font-size:10px;margin-bottom:5px}.level-item .price{display:block;font-size:15px;font-weight:800}.level-item .note{display:block;color:#69758f;font-size:9px;margin-top:3px}.level-item.primary{border-color:#40557e;background:#15213a}@media(max-width:900px){.level-map-list{grid-template-columns:repeat(2,minmax(120px,1fr))}}'
          text = text[:old_css.start()] + new_css + text[old_css.end():]

          old_markup = '<div id="levelMap" class="level-map"><div class="track"></div><div class="map-label left" id="mapLeft">—</div><div class="map-label right" id="mapRight">—</div></div>'
          new_markup = '<div id="levelMap" class="level-map"><div id="levelMapList" class="level-map-list"><div class="muted">Waiting for provider levels…</div></div></div>'
          if old_markup not in text:
              raise SystemExit('level map markup not found')
          text = text.replace(old_markup, new_markup, 1)

          old_fn = re.search(r'function renderLevelMap\(d,cw,pw\)\{.*?\}\nfunction render\(d\)', text, re.S)
          if not old_fn:
              raise SystemExit('renderLevelMap function not found')
          new_fn = '''function renderLevelMap(d,cw,pw){const items=[['Support',d.support,'Below spot'],['Put Wall',pw?.strike,'Gamma wall'],['Spot',d.spot,'Current NIFTY',true],['Resistance',d.resistance,'Above spot'],['Gamma Flip',d.gamma_flip,'Regime level'],['Max Pain',d.max_pain,'Option pain'],['Call Wall',cw?.strike,'Gamma wall']].filter(x=>Number.isFinite(Number(x[1])));$('levelMapList').innerHTML=items.map(([label,val,note,primary])=>`<div class="level-item${primary?' primary':''}"><span class="name">${esc(label)}</span><span class="price">${esc(n(val,0))}</span><span class="note">${esc(note)}</span></div>`).join('')}\nfunction render(d)'''
          text = text[:old_fn.start()] + new_fn + text[old_fn.end():]

          text = text.replace("$('levelMap').querySelectorAll('.marker').forEach(x=>x.remove());renderLevelMap(d,cw,pw);", "renderLevelMap(d,cw,pw);")
          path.write_text(text, encoding='utf-8')
      - name: Commit simplified UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/quantnifty/web/index.html
          git diff --cached --quiet || git commit -m "Simplify market level map"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/simplify-level-map.yml
          git commit -m "Remove one-time level map workflow"
          git push
