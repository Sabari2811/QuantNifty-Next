[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "quantnifty-next"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pyarrow>=20,<25", "python-multipart>=0.0.20,<1", "thrift>=0.20,<1"]
[tool.setuptools.packages.find]
where = ["src"]
