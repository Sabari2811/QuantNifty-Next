<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantNifty</title><style>body{font-family:Inter,system-ui;background:#0b1020;color:#e8edf7;margin:0;padding:28px}main{max-width:1200px;margin:auto}h1{margin-bottom:4px}.sub{color:#8e9ab5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:24px}.card{background:#131b31;border:1px solid #263250;border-radius:14px;padding:18px}.v{font-size:28px;font-weight:700;margin-top:8px}</style></head><body><main><h1>QuantNifty Next</h1><div class="sub">Live NIFTY options analytics</div><div id="state" class="card" style="margin-top:18px">Connecting…</div><div class="grid" id="grid"></div></main><script>const state=document.getElementById('state'),grid=document.getElementById('grid');function card(k,v){return `<div class="card"><div class="sub">${k}</div><div class="v">${v??'—'}</div></div>`}function render(d){state.innerHTML=`<b>${d.bias||'UNAVAILABLE'}</b> · Confidence ${d.confidence??'—'}% · ${d.data_integrity||'UNKNOWN'}`;grid.innerHTML=[['NIFTY',d.spot],['PCR',d.pcr],['Bullish',d.bullish_score],['Bearish',d.bearish_score],['GEX',Math.round(d.gex||0)],['DEX',Math.round(d.dex||0)],['IV Skew',(d.iv_skew||0).toFixed(2)],['Gamma Flip',d.gamma_flip??'—'],['Structure',d.structure],['Expiry',d.expiry]].map(x=>card(x[0],x[1])).join('')}const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${proto}://${location.host}/ws`);ws.onopen=()=>state.textContent='Connected';ws.onmessage=e=>render(JSON.parse(e.data));ws.onerror=()=>state.textContent='Connection error';</script></body></html>
