services:
  - type: web
    name: quantnifty-api
    runtime: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install -e ./apps/api
    startCommand: uvicorn quantnifty.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantnifty-production
          property: connectionString

databases:
  - name: quantnifty-production
    region: singapore
    plan: basic_256mb
    postgresMajorVersion: 18
